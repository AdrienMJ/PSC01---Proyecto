name: Java CI with Gradle and Doxygen Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write   # Permiso para registrar el grafo de dependencias
  pages: write      # Permiso para poder actualizar la web de GitHub Pages
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Tarea original: Compilación y verificación general
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      
    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

  # 2. Tarea original: Envío de dependencias para alertas de seguridad
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4
      with:
        build-root-directory: .

  # 3. Nueva Tarea (Sprint 3): Construcción de Doxygen y despliegue web
  build-and-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Instalar Doxygen en el servidor de GitHub
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen

    - name: Hacer ejecutable el script de Gradle
      run: chmod +x gradlew

    - name: Compilar Proyecto de Java
      run: |
        cd myapp
        ./gradlew build -x test

    - name: Generar Documentación con Doxygen en GitHub
      run: |
        mkdir -p docs/doxygen
        doxygen Doxyfile

    - name: Configurar páginas estáticas de GitHub
      uses: actions/configure-pages@v4

    - name: Subir artefacto de Doxygen generado
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs/doxygen/html'

    - name: Desplegar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4